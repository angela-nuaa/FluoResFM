name: Repository contract

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/check_repository.py --workspace-root .
      - name: Check frozen submodule revisions
        run: python scripts/doctor.py --workspace-root . --skip-runtime
      - name: Compile owned scripts
        run: python -m compileall -q scripts
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
