# FluoResFM 基础运行环境（Python 3.12 + CUDA 12.4）。
#
# 创建后必须运行 ``python scripts/doctor.py``。该命令会检查子模块、运行时
# 依赖和（可选的）本地资产；它比“环境创建成功”更接近可复现的定义。
# flash-attn 不在默认环境中：当前冻结的 BioSR-MT 生产配置明确使用
# ``flash_attention: false``。如确有需要，见 requirements/optional-linux.txt。
name: fluoresfm
channels:
  - conda-forge
  - pytorch
  - nvidia
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - -r requirements/runtime-cu124-py312.txt
